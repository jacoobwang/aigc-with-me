name: Auto Discover and Import Items

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated source ids, or all"
        required: false
        default: "all"
      limit:
        description: "Maximum candidates to process"
        required: false
        default: "20"
      target_created:
        description: "Target number of items to create; 0 keeps candidate limit behavior"
        required: false
        default: "0"
      dry_run:
        description: "Run discovery and enrichment without writing to Sanity"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  auto-update-items:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Discover and import items
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          DEFAULT_AI_PROVIDER: ${{ secrets.DEFAULT_AI_PROVIDER }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
        run: |
          SOURCES="${{ github.event.inputs.sources || 'all' }}"
          LIMIT="${{ github.event.inputs.limit || '20' }}"
          TARGET_CREATED="${{ github.event.inputs.target_created || '0' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          if [ "$DRY_RUN" = "true" ]; then
            pnpm auto-update:dry-run -- --sources "$SOURCES" --limit "$LIMIT"
          else
            pnpm auto-update:items -- --sources "$SOURCES" --limit "$LIMIT" --target-created "$TARGET_CREATED"
          fi
